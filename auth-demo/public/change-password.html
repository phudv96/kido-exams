<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Đổi mật khẩu</title>
</head>
<body>
  <h1>Đổi mật khẩu</h1>
  <form id="changeForm">
    <div>
      <label>Mật khẩu cũ: <input type="password" id="oldPassword" required /></label>
    </div>
    <div>
      <label>Mật khẩu mới: <input type="password" id="newPassword" required /></label>
    </div>
    <button type="submit">Đổi mật khẩu</button>
  </form>
  <p id="message"></p>
  <p><a href="account.html">Quay lại trang tài khoản</a></p>

  <script>
    document.getElementById('changeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const messageEl = document.getElementById('message');

      const res = await fetch('/api/users/me/password', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oldPassword, newPassword }),
      });

      if (res.ok) {
        messageEl.style.color = 'green';
        messageEl.textContent = 'Đổi mật khẩu thành công, đang chuyển sang trang đăng nhập...';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      } else {
        const data = await res.json();
        messageEl.style.color = 'red';
        messageEl.textContent = data.error || 'Đổi mật khẩu thất bại';
      }
    });
  </script>
</body>
</html>
